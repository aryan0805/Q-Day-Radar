# ---- Phase 4: newest ECC-256 estimates ----------------------------------------------------------
# Fairness rule: each Shor target is compared with its most recent estimate. The newest ECC-256
# preprints use other hardware (IonQ Sep 2026 trapped ions at 1e-4; Cain et al. Mar 2026 neutral
# atoms at a 1 ms cycle; Alice & Bob ePrint 2026/2665, Oct 28 2026, cat qubits, read only through
# secondary sources and therefore not stored). The newest paper on a scenario's own hardware family
