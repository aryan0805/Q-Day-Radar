# ---- Phase 4: classical deprecation (below 112-bit security) -----------------------------------
- id: sp800_131a
  target: other
  quantity: minimum_security_strength_bits
  year: 2019
  value: 112
  units: bits of security strength (minimum for Federal Government protection)
  assumptions: "NIST SP 800-131A Revision 2 (March 2019, final). RSA with a modulus below 2048 bits and ECDSA/EdDSA or EC DH/MQV with n below 224 bits are below 112 bits of security and are disallowed for applying protection (RSA 1024 <= n < 2048 and ECDSA 160 <= n < 224 remain legacy use for verifying old signatures only). SHA-1 is disallowed for digital signature generation except where NIST protocol-specific guidance allows it, allowed for legacy signature verification, and acceptable for non-signature uses that do not require collision resistance. Revision 3 exists only as an initial public draft (21 October 2024, proposes a schedule for retiring SHA-1 and 224-bit hashes)"
  source_url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar2.pdf
  locator: "Section 1.2.1 p. 2: 'a security strength of at least 112 bits is required at this time for applying cryptographic protection'; Table 2 p. 9 (RSA len(n) < 2048 and ECDSA len(n) < 224 disallowed); p. 10 ('the length of n shall be at least 224 bits'; 'The length of the modulus n shall be 2048 bits or more'); Table 4 p. 13 (EC DH/MQV len(n) < 224); Table 5 p. 15 (RSA key establishment); Table 8 pp. 18-19 (SHA-1)"
  retrieved: 2026-11-08
- id: sp800_57_pt1r5_sha1_collision
  target: other
  quantity: sha1_collision_security_strength_bits
  year: 2020
  value: 80
  units: bits (upper bound on SHA-1 collision security strength)
  assumptions: "NIST SP 800-57 Part 1 Revision 5 (May 2020, final): for digital signatures and other applications requiring collision resistance SHA-1 has a security strength of at most 80 bits (below the 112-bit minimum); for HMAC, key derivation and random bit generation the table does not give SHA-1 that limit"
  source_url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf
  locator: "Table 3 (Maximum security strengths for hash and hash-based functions), row <= 80: SHA-1, footnote 74: 'SHA-1 has been demonstrated to provide less than 80 bits of security for digital signatures, which require collision resistance'"
  retrieved: 2026-11-08

